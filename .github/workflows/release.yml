# Publishes a GitHub release when a version tag is pushed.
#
# One tag, one package, one release. `git push origin desert-tooling-v0.3.0`
# builds THAT package from the tagged commit and publishes its zip plus
# SHA256SUMS under a release named for the tag. The notes are the package's
# CHANGELOG entry for the version, then the checksums (the `release-notes` tool).
#
# Two packages ship: DesertTooling.asi (the one plugin, from desert-tooling) and
# the DMM offset-patch pack. Only the tagged one is built, deliberately. They are
# versioned separately - the plugin off its Cargo.toml, the pack off
# dmm_pack.json - so a release that rebuilt both would sooner or later attach an
# untagged package's OLD version number to NEW bytes, and two release pages would
# then disagree about what one version contains. The other package has its own
# tag and its own releases; nothing is lost by leaving it out of this one.
#
# Nothing is published until every gate below has passed, in this order:
#   * the tagged commit is on main, the release branch
#   * the tag's version equals the one in the source of truth: the crate's
#     Cargo.toml, or dmm_pack.json for the pack
#   * docs in sync, clippy clean, native tests green (ci.yml's checks minus the
#     weekly audit, which has its own job and its own reasons to go red)
#   * SHA256SUMS verifies against the zips just built
#
# Then, in a second job, that zip goes to Nexus Mods as a new version of the file
# already there. Both packages share one mod page (crimsondesert/mods/3369) as
# two separate files, so which file a tag updates is what
# tools/nexus-targets.json says. That job reads the release it just made rather
# than rebuilding, so Nexus gets the bytes GitHub is serving, and it skips any
# package whose entry in that file has no file_id yet.
#
# What is NOT here: running the plugin in the game. VERSIONING.md step 5 is
# still a person with the game installed, before the tag is pushed.
name: release

on:
  push:
    tags:
      - "desert-tooling-v*"
      - "desert-gatherer-dmm-v*"

# Creating the release and uploading its assets needs write, and nothing else does.
permissions:
  contents: write

# One release job per tag at a time; never cancel one that is already uploading.
concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry check below needs main's history, not just the tagged commit.
          fetch-depth: 0

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main. Merge first, then tag the merged commit." >&2
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes

      # Same key as ci.yml, so a tag reuses the deps the last main build compiled.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The tag/version gate and the packaging both live in tools/ now, which is
      # a separate cargo workspace of host binaries. It used to be stdlib-only
      # Python and ran as the very first step, before Nix existed; it needs the
      # toolchain now, so it moved down here. It is still ahead of every step
      # that produces or publishes anything.
      - name: Build the tools
        run: nix develop --command just tools

      # The `nexus` job needs two of these and runs on a bare runner with no Nix
      # and no cargo cache. Uploading them here means they are built ONCE, with
      # the toolchain flake.lock pins, rather than a second time against
      # whatever Rust the runner image happens to ship.
      - name: Keep the tools for the nexus job
        uses: actions/upload-artifact@v4
        with:
          name: tools
          path: |
            tools/target/x86_64-unknown-linux-gnu/release/nexus-target
            tools/target/x86_64-unknown-linux-gnu/release/release-notes
          retention-days: 1
          if-no-files-found: error

      - name: Tag matches the version in the source
        run: nix develop --command tools/target/x86_64-unknown-linux-gnu/release/release-notes "$GITHUB_REF_NAME" --title

      - name: Docs match Cargo.toml
        run: nix develop --command just check-versions

      - name: Clippy (Windows + native, warnings are errors)
        run: nix develop --command just clippy

      - name: Tests (native)
        run: nix develop --command just test-native

      # Just this tag's package. `dist` with no argument still builds both,
      # which is what `just dist` and a local build want.
      - name: Build the package
        run: |
          tools=tools/target/x86_64-unknown-linux-gnu/release
          nix develop --command "$tools/dist" "$("$tools/release-notes" "$GITHUB_REF_NAME" --package)"

      - name: Checksums verify
        run: cd dist && sha256sum --check --strict SHA256SUMS

      - name: Release notes
        run: |
          tools/target/x86_64-unknown-linux-gnu/release/release-notes \
            "$GITHUB_REF_NAME" --sums dist/SHA256SUMS > "$RUNNER_TEMP/notes.md"
          echo "::group::notes.md"; cat "$RUNNER_TEMP/notes.md"; echo "::endgroup::"

      # gh is preinstalled on the GitHub-hosted runners. --verify-tag refuses to
      # invent a tag if the ref somehow isn't one, and creating a release that
      # already exists fails rather than overwriting its assets.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$(tools/target/x86_64-unknown-linux-gnu/release/release-notes "$GITHUB_REF_NAME" --title)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*.zip dist/SHA256SUMS

  # Publishes the tagged package to the mod page, as a new version of the file
  # that is already there. One page, two files, both under Main: the DesertTooling
  # ASI and the DMM pack. desert-tooling's target is skipped until its file_id is
  # filled in - its file has to be created by hand on the page once, because the
  # three .asi files it replaces are not it.
  #
  # A separate job, and deliberately so: it runs only after `release` has cut the
  # GitHub release, it re-downloads the assets from that release rather than
  # rebuilding, and if Nexus is down or rejects the upload you can re-run this
  # job alone. Re-running `release` would fail on `gh release create`.
  #
  # The Upload API only adds a VERSION to a file that already exists. It cannot
  # create a mod page, or the first file on one; those are done by hand, once,
  # and the two numbers they produce go in tools/nexus-targets.json (still JSON;
  # only the script that reads it became Rust). A package
  # with no entry there is skipped, and its tag still cuts a GitHub release.
  #
  # Needs one secret: NEXUS_API_KEY, a personal API key from
  # https://www.nexusmods.com/settings/api-keys. It is account-wide and cannot be
  # scoped to one mod, so it is only ever passed to the pinned action below.
  nexus:
    needs: release
    runs-on: ubuntu-latest
    # Reads the release assets; writes nothing back to the repo.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Built by the `release` job with the pinned toolchain; this runner has no
      # Nix and no cargo cache, so it does not rebuild them.
      - name: Fetch the tools
        uses: actions/download-artifact@v4
        with:
          name: tools
          path: tools-bin
      - run: chmod +x tools-bin/*

      # Which of the two zips this tag is for, and which Nexus file it updates.
      # Also validates the version and display name against what the API accepts,
      # so a bad name is caught here and not after the bytes are uploaded.
      - name: Which Nexus file this tag publishes to
        id: target
        run: ./tools-bin/nexus-target "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      # From the release, not from a rebuild: the bytes that go to Nexus are the
      # ones SHA256SUMS was computed over and the ones GitHub is serving.
      - name: Fetch the release assets and verify them
        if: steps.target.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --dir dist --clobber
          cd dist && sha256sum --check --strict SHA256SUMS

      # The mod id the API wants is not the number in the page URL. Resolve it
      # from that number rather than keeping a second, invisible id in the JSON.
      - name: Resolve the Nexus mod id
        id: mod
        if: steps.target.outputs.publish == 'true'
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          DOMAIN: ${{ steps.target.outputs.game_domain }}
          SCOPED_ID: ${{ steps.target.outputs.game_scoped_id }}
        run: |
          id=$(curl -sS --fail-with-body \
                 -H "apikey: $NEXUS_API_KEY" \
                 "https://api.nexusmods.com/v3/games/$DOMAIN/mods/$SCOPED_ID" \
               | jq -r '.data.id')
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "::error::no mod id for $DOMAIN/$SCOPED_ID. Check game_scoped_id in tools/nexus-targets.json, and that NEXUS_API_KEY is set." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # The changelog entry only. The release notes' file list and checksum table
      # are GitHub's; the Files tab already lists what is on the page. The page's
      # changelog is keyed by version string and appends, so both files can write
      # to it without overwriting each other.
      - name: Changelog for the Nexus page
        id: changelog
        if: steps.target.outputs.publish == 'true' && steps.target.outputs.changelog == 'true'
        run: |
          {
            echo "text<<NEXUS_CHANGELOG_EOF"
            ./tools-bin/release-notes "$GITHUB_REF_NAME" --changelog
            echo "NEXUS_CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # Pinned to a commit, not a tag: this action is handed an account-wide API
      # key, and a moved tag would silently change what runs. v1.0.0-beta.10.
      - name: Upload to Nexus Mods
        if: steps.target.outputs.publish == 'true'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ steps.target.outputs.file_id }}
          filename: dist/${{ steps.target.outputs.zip }}
          version: ${{ steps.target.outputs.version }}
          # Without the version: the Files tab has its own version column, and
          # these names are what the page's descriptions refer to.
          display_name: ${{ steps.target.outputs.display_name }}
          category: ${{ steps.target.outputs.category }}
          # Two files on one page, so at most one of them may own the page's
          # version field; `nexus-target` refuses a config where two do.
          update_mod_version: ${{ steps.target.outputs.update_mod_version }}
          # The version this replaces goes to the archive rather than sitting
          # beside it as a second file under the same heading.
          archive_existing_version: true
          mod_id: ${{ steps.mod.outputs.id }}
          changelog: ${{ steps.changelog.outputs.text }}
