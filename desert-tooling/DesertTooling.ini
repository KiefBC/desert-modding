; Desert Tooling - place next to DesertTooling.asi in bin64.
;
; ONE file configures all four subsystems. Each owns the [Section] its keys sit
; under, and a key belongs to the header above it: Enabled, Debug and DryRun each
; appear more than once and mean different things in each place.
;
;   [Looter]    auto-loot for gathering nodes, ground items, insects and fish
;   [Gatherer]  the gathering yield multipliers
;   [Overlay]   the in-game settings menu (Insert)
;   [Dispatch]  faster dispatch missions, bigger rewards, and a dump of both
;
; Read at game start and re-read while the game runs: the file's modified time is
; checked once a second, and a change takes effect within about a second. The
; exceptions are the game-side hooks, which are installed once at load, the whole
; [Overlay] section, which is read once at startup and needs a restart, and
; [Dispatch] Enabled, which cannot be turned back on mid-session if it was off at
; launch - each is noted where it sits.
;
; The in-game menu edits this same file, live, while you play, and it edits it in
; place: it replaces only the values of the keys it shows, so these comments,
; your ordering and any key it does not draw survive untouched. Editing the file
; by hand while the game runs works just as well, and the menu picks the change
; up within a second.
;
; A setting changed from the menu is permanent: it is written here, so it is still
; set the next time you launch. Font, at the bottom, is the one key the menu does
; not draw - it is free text rather than a list to pick from - and it is left
; exactly as you write it. If this file cannot be read or written, the menu says so
; in red under the section it belongs to; nothing is lost and the game is never
; affected.
;
; Everything the plugin does goes into DesertTooling.log beside this file, one
; line per event, each tagged with the subsystem that wrote it - [looter],
; [gatherer], [overlay], [dispatch] or [tooling].

; ===========================================================================
; [Looter] - auto-loot
; ===========================================================================
[Looter]

; Master switch. 0 = the looter is idle: no gathering, no hotkeys, nothing
; logged. Live - set it to 1 while the game runs and it comes back.
Enabled=1

; 1 = verbose log (structure dumps, timings, every decision).
Debug=0

; 1 = log every item the game hands the player, as `[recv] item <key>
; x<count>`, whether or not the plugin caused the pickup. For measuring
; yields; capped per session.
LogReceived=0

; Survey radius in game metres.
ScanRange=40

; How many actor lines one F11 survey prints (16..2000). Gather nodes and
; items are listed first, so raising this only ever adds the less interesting
; actors, and the survey's last line says how many it cut.
SurveyLines=200

; The gather key and auto mode pick the nearest plant/ore/stone/wood node
; within this many metres (max 50). 6 m is confirmed to work.
GatherRange=6

; 1 = automatic gathering is on from the start (KeyToggle flips it).
AutoGather=0

; The game attaches interaction data to one nearby node at a time; the rest
; show as "Unarmed" in the survey. 1 = target those too (this is what lets
; auto mode mine whole veins without swinging). 0 = only armed nodes.
GatherUnarmed=1

; 1 = also pick up basic items lying on the ground (ore chunks and other
; "item_basic_*" drops). Quest and special items are never targeted, and
; anything the game would count as stealing is skipped.
GatherItems=1

; 1 = dropped weapons and armour ("item_basic_equip_*") are picked up too.
; Off by default: they are outside gathering and each one costs a bag slot.
GatherGear=0

; What to gather, by node family. 0 = nodes of that family are passed over,
; the way GatherItems=0 passes over ground items. The first four are on by
; default and Money is off - it has never been tried in game, see below; set
; the rest to 0 to farm one family for a while. The families are the same
; ones the [Gatherer] section multiplies, so the names line up.
;
; Plants, fruit, berries, mushrooms, crops - and the water well, whose record
; is a Foraging record. You still lower and crank the bucket yourself; this
; only sends the final pickup, as at a bush. Not yet tried in game.
GatherForaging=1
; Firewood cut from felled trees ("firewood_*").
GatherLogging=1
; The "collect_mine" family: mine_* rocks and veins, breakable stalactites.
GatherMining=1
; The "collect_ore" family: ore_* deposits, sulfur stone. Separate from
; Mining - they look alike in game, so set both to gather all of them.
GatherOre=1

; 1 = also pick up the coins lying in the world (the placed coin props:
; "gimmick_item_common_coin_0001" and its siblings). Off by default because
; it has never been tried in game: the coin props carry no interaction data,
; so they show as "Unarmed" in the survey and the pickup would be forged the
; same way as at an ore dropping. Until 2026-09-13 they were not a family at
; all, which is the only reason the looter has always passed them by. This is
; just the auto-loot switch - how much a coin pays is the [Gatherer] Money
; multiplier, which applies when you pick one up by hand as well.
GatherMoney=0

; 1 = catch insects within GatherRange. They are not a gather family and not
; a ground item: catching one is a different game event, sent at the creature
; itself. The game's steal check still applies, so a bug someone owns is left
; alone. 0 = insects are passed over.
GatherBugs=1

; 1 = catch fish within GatherRange, by hand at the water's edge. The same
; game event as an insect, sent at the fish itself; the two are told apart
; only by the creature's own class byte, which is why they have separate
; switches. The steal check still applies. 0 = fish are passed over.
;
; Creatures whose class has never been seen caught - birds in flight, and a
; few species not yet identified - are always passed over, whatever these two
; are set to, and the log says so once per class.
GatherFish=1

; Which inventory tab counts as the bag for the "is it full" check. Tab 1 is
; the main bag (the HUD's n/132). The survey lists every tab as id:used/max.
; -1 = the tab with the largest capacity (not the bag; do not use).
BagTab=1

; When the bag is full, a node whose yield is already stacked in the bag is
; still gathered (the game allows that), unless the stack would pass this
; ceiling. Stacks of 585 have been seen, so 999 is a margin, not a game rule.
StackLimit=999

; Milliseconds between two automatic sends (100..60000). Nodes and chunks
; vanish within about 100 ms of a send.
GatherInterval=500

; After sending for a node, leave it alone this long before trying it again
; (100..60000 ms). A node that disappears sooner is counted as gathered.
NodeCooldown=8000

; Keys: F1..F24, A..Z, 0..9, NUM0..NUM9, NUMPLUS NUMMINUS NUMMULT NUMDIV NUMDOT,
; HOME END INSERT DELETE PAGEUP PAGEDOWN TAB SPACE BACKSPACE SCROLLLOCK PAUSE,
; MOUSE3 MOUSE4 MOUSE5. Avoid keys the game uses, and avoid KeyMenu below.
KeyToggle=F10
KeyScan=F11
; Gather the nearest node: one node per press, whatever the auto state.
KeyGather=F9
; Debug: toggle recording of every event the game queues (capped at 300).
KeyRecord=F7

; ===========================================================================
; [Gatherer] - gathering yield multipliers
;
; A changed multiplier takes effect on the NEXT GATHER, not the next game
; start: the plugin remembers every record's vanilla yields as it loads them,
; and rewrites the already-loaded records in place right after the ini change
; is picked up. Bugs and Fish are read as the creature is caught, so those
; take effect on the next catch. The README explains the mechanism and the
; log lines.
; ===========================================================================
[Gatherer]

; Master switch. 0 = the record-loader hook still reads every record to keep
; its own remembered table current, but writes nothing as records load, and a
; pass right after this changes writes vanilla numbers back into whatever is
; already loaded. Flipping it back to 1 re-applies the multipliers the same
; way - either way, the change counts from the next gather, not the next
; launch.
Enabled=1

; 1 = show, do not touch. The hook logs a "[dry]" line for every record it
; would change - key, name, family, multiplier and each block's old and new
; min/max - and writes nothing to the game. Off by default.
;
; Turn it on to see what the plugin would do after a game update, or when you
; are reporting a problem; then include the log.
DryRun=0

; 1 = also log the records that are NOT gather nodes. The table holds about
; 13,875 records, so this is capped at 400 lines. Only useful when a family
; seems to be missing and you want to see what the loader is handing us.
Debug=0

; ---------------------------------------------------------------------------
; Yield multipliers, 1..100. 1 = vanilla, the record is left alone entirely.
; They multiply the minimum AND the maximum quantity a node produces, so a
; node that gave 1-3 gives 2-6 at x2.
;
; All of them ship at 1, so the plugin changes nothing until you say otherwise.
; Raise the families you want, here or from the in-game menu; x2 is a good
; first try.
;
; Note that most nodes carry SEVERAL ranges and a single pick pays out one of
; them at random, so a multi-item plant varies from pick to pick in vanilla
; too - what is multiplied is every range, not the amount any one pick gave.
; A record of 4-7/2-3/1-1/1-1 becomes 8-14/4-6/2-2/2-2 at x2, so picks that
; used to give 1 now give 2 and picks that used to give 5 now give 10.
;
; There are five families now, and setting one never affects the others. Four
; of them are independent internal groups in the game's own data, exactly as in
; the DMM pack. Money is the odd one: it is money rather than a material, and
; it came with this plugin rather than the pack.
; ---------------------------------------------------------------------------

; Plants, fruit, berries, mushrooms, crops - and the water you draw from a
; WATER WELL, which is gathered out of the world like the rest. 83 records.
; A well pays a fixed amount (its min and max are equal), so there is no roll:
; at 3, a well that gave 5 gives exactly 15, every time. The breakable water
; pots and the goods on market stalls are not gathering nodes and are not
; touched by anything here.
Foraging=1

; Firewood cut from felled trees ("firewood_*"). 141 records.
Logging=1

; The "collect_mine" family: mine_* rocks and veins, cave and attached
; variants, breakable stalactites. 36 records.
Mining=1

; The "collect_ore" family: ore_* deposits, sulfur stone, collectible
; stalactites. 16 records. Separate from Mining - these look alike in game but
; are different families, so set both if you want all mining-style gathering
; raised together.
Ore=1

; The money lying in the world: the placed coin and silver bar props, 3
; records, all paying the game's one money item. In vanilla a small coin pays
; 10-15, a large one 100-150, and a silver bar a fixed 2500.
;
; This multiplies money you find lying in the world and NOTHING else: not enemy
; drops, not quest rewards, not coin pouches, not chests, not shop prices, not
; dispatch rewards.
;
; It ships at 1 on purpose. Every other key here saves you trips; this one
; changes how fast you get money, which is a balance decision rather than a
; convenience, so it is left for you to make.
;
; Copper, silver and gold are display units over a single count, so a
; multiplied pickup may show up as a different denomination than the vanilla
; one did - 2500 copper is 25 silver.
;
; Confirmed in game on build 25246367: three coins picked up by hand paid 15,
; 14 and 15 at 1 (inside the 10-15 range), and one picked up at 3 paid 30 -
; the bag went up by exactly 30 - so the props read their record and this
; multiplier reaches it, including when you change it mid-session.
Money=1

; ---------------------------------------------------------------------------
; Creatures caught by hand, 1..100. Same range and the same meaning, but a
; different mechanism: insects and fish are not gather nodes and there is no
; record anywhere holding what one is worth - the game grants exactly one,
; from a constant in its own code. So these two are a small code patch on
; that constant, applied as the creature is caught, and a change takes effect
; on the NEXT CATCH with nothing to reload.
;
; Because it is a code patch, it is the first thing a game update breaks. If
; the game changes, the log says so once at startup ("[catch] signature not
; found; catch multipliers off") and everything else here keeps working.
; ---------------------------------------------------------------------------

; Insects caught by hand.
Bugs=1

; Fish caught by hand at the water's edge.
Fish=1

; ---------------------------------------------------------------------------
; CONFLICTS - read this
;
; This section edits the same minimum/maximum quantities that:
;   - DMM's "The Desert Gatherer" module pack (Foraging/Logging/Mining/Ore
;     Nodes at 2X/5X/10X), and
;   - DMM's built-in gathering multiplier preset
; edit on disk. If either is mounted while this .asi is installed, the two
; multiply on top of each other (DMM 5X plus Mining=2 here gives 10x).
;
; Unmount both in DMM before using this plugin.
; ---------------------------------------------------------------------------

; ===========================================================================
; [Overlay] - the in-game settings menu
;
; Read ONCE at game start; changing anything in this section needs a restart.
; (The settings the menu puts on screen are read and written live - it is only
; the menu's own settings, below, that are not.)
; ===========================================================================
[Overlay]

; Master switch. 0 = no graphics hook is installed at all, so the game renders
; exactly as it does without the .asi and there is no menu. The other two
; subsystems are unaffected: use this rather than uninstalling if you want to
; rule the overlay out while chasing a crash.
Enabled=1

; 1 = verbose log. Every ini write and reload gets a line in
; DesertTooling.log, and everything hudhook says is logged with it - not only
; its warnings and errors but its per-frame debug and trace lines, which is
; what a "the game will not start" or "the menu never appears" report needs.
; That is a lot of writing: the log stops taking hudhook lines after 20000 of
; them, and a restart is what starts it again. Off by default; warnings and
; errors are always logged.
Debug=0

; The key that shows and hides the menu. Pressed once to open, once to close.
;
; Names: F1..F24, A..Z, 0..9, NUM0..NUM9, NUMPLUS NUMMINUS NUMMULT NUMDIV
; NUMDOT, HOME END INSERT DELETE PAGEUP PAGEDOWN TAB SPACE BACKSPACE
; SCROLLLOCK PAUSE, MOUSE3 MOUSE4 MOUSE5.
;
; Avoid keys the game uses, and avoid the four the [Looter] section already
; has (F7, F9, F10, F11 by default).
KeyMenu=Insert

; 1 = the menu is already open at the first frame, instead of waiting for the
; key. Handy the first time, so you can see that the overlay is working at all.
ShowOnStart=0

; Size of the menu: fonts, spacing and the window itself. 0 = follow the
; Windows display scaling (125% in Settings > Display gives 1.25). Set a number
; from 0.5 to 4 to fix it; 2 is comfortable on a 4K screen at 100% scaling.
Scale=0

; Height of the menu's text in pixels, before Scale is applied: at Scale 1.25
; a FontSize of 20 is rasterised at 25 px. From 8 to 72. The font is rendered
; at that size rather than blown up from a small bitmap, so raising this makes
; the text sharper, not blockier. Raise it if the menu is hard to read.
FontSize=20

; The font the menu is drawn in. A bare file name is looked up in the Windows
; Fonts folder (%WINDIR%\Fonts); an absolute path is used as it stands. Leave
; it empty to go back to Dear ImGui's own small built-in font.
;
; segoeui.ttf is the Windows UI font and the clearest at small sizes. For a
; more fantasy, serif look try georgia.ttf, constan.ttf (Constantia) or
; cambria.ttc:0 - the :N suffix picks a face out of a .ttc collection, and 0
; is the first, which is what you want unless you know otherwise.
;
; A file that is missing or unreadable is not an error: the menu says so in
; DesertTooling.log and draws with the built-in font.
Font=segoeui.ttf

; How bright the menu's white is on an HDR display, in nits. The game presents
; an HDR10 signal, and the menu has to be encoded for it or it comes out blown
; out and oversaturated; this is the level plain white is drawn at. 203 is the
; broadcast reference for paper white and what ReShade's own overlay uses.
; Raise it if the menu looks dull next to the game, lower it if it glares.
; From 80 to 1000. Ignored entirely on an SDR display.
HdrBrightness=203

; Which colour space the menu is encoded for.
;
;   auto   ask the swapchain and follow it (what the game says it presents)
;   sdr    plain sRGB, exactly what versions before this one always did
;   hdr10  force BT.2020 primaries with the PQ transfer curve
;   scrgb  force linear BT.709, 1.0 = 80 nits
;
; Leave it on auto. The three forced values are for when the detection is
; wrong - the symptom is a menu that is washed out, too dark or wildly
; oversaturated while the game itself looks right.
ColorSpace=auto

; The menu's colour theme. The picker at the top of the menu switches it live
; and prints the name to pick here; this key is what makes the choice stick.
; Unknown names fall back to classic with a warning in DesertTooling.log.
; One of: classic, parchment, gilded, splash, banner, steel
Theme=banner

; ===========================================================================
; [Dispatch] - dispatch missions
; ===========================================================================
;
; Dispatch missions ("faction operations") are the jobs you send workers away on
; from the faction map. This section makes them finish sooner, pay more, and
; stop turning you away - and it dumps what it finds into DesertTooling.log so
; the numbers can be checked.
;
; NOTHING HERE IS SAVED INTO YOUR GAME. The mission and reward tables are read
; from the game's own files every time it starts, so setting these back to 1 and
; 0 puts every mission back, and deleting the plugin leaves nothing to undo.
;
; REWARDS BANKS NOTHING. The game works out what a reward actually pays at the
; moment the items land, from the tables as they stand then - so a reward that is
; already waiting on you pays at whatever Rewards says when it arrives, not at
; what it said when the mission finished. Set Rewards back to 1, or remove the
; plugin, and a reward still waiting pays vanilla.
;
; NOR, ON THIS GAME BUILD, DOES ANYTHING ELSE. The game has code to bank a single
; percentage figure for a finished mission in your save, and part of that figure
; is a bonus for sending more workers than the mission needed - which is the one
; thing AnyOperatorCount could have inflated, since it tells the game every
; mission needs only one worker. Both of the switches that code sits behind are
; turned OFF on build 25116796: no mission defers a payout, and the figure
; ignores the worker count entirely. The plugin reads both at startup and says so
; in the log, on the [banking] line - check it after a game update, because these
; are the kind of switch an update can flip.
;
; So nothing here reaches your save today. The paragraph exists because the
; mechanism exists: if a future build turns those switches on, finishing a
; mission with AnyOperatorCount=1 would bank a bigger figure than you earned, on
; the 142 of 936 missions that can repeat, and it would pay out later even with
; the plugin gone. It would be bounded to the missions you finished with the
; setting on, it would clear itself as those rewards landed, and it would not be
; a corrupted save. The [banking] line is how you would know.
;
; Speed and NoSkillRequirement are nowhere in that figure and leave nothing
; behind at all.
;
; No game code is patched and no hook is installed here: the plugin edits five
; fields of the tables the game has already read, on its own thread, and
; remembers what each one said first so it can put it back. A change takes
; effect within about a second. Speed reaches missions already under way, and
; Rewards reaches rewards already waiting to be paid; NoSkillRequirement and
; AnyOperatorCount are checked when a mission starts, so a mission already
; running carries on under the rules it started with - but a REPEATING mission
; re-checks them every time it restarts, which is why a repeating operation stops
; with an error message once the plugin is gone.
[Dispatch]

; Master switch, and it means two different things depending on when you set it.
;
; Turned off WHILE THE GAME RUNS it is the revert: it puts every mission and
; reward it changed back to vanilla, and turning it on again re-applies them.
;
; Turned off BEFORE YOU LAUNCH the pass never runs and nothing in the game is
; read at all - and that lasts the whole session. Turning it back on while the
; game is running does nothing in that case, from here or from the in-game menu,
; because there is no pass left to wake up; you get the section back at the next
; launch.
Enabled=1

; ---------------------------------------------------------------------------
; Missions
; ---------------------------------------------------------------------------

; Divide every mission's duration by this, 1..100. 1 = vanilla, and vanilla runs
; from 2h to 96h; 4 turns a 16h mission into a 4h one. No mission ever goes
; below 6 minutes, whatever you set.
;
; This reaches missions already under way, not only the ones you have not sent
; yet: the game compares a mission's progress against the duration in the table
; each time it ticks, so shortening the duration can finish a mission that is
; already out.
Speed=1

; 1 = clear the skill a mission demands of a worker you assign, on the 147
; missions that demand one. The bonus a mission pays for sending a skilled
; worker is a different field two bytes away and is deliberately left alone -
; clearing that would quietly cost you rewards.
;
; Checked when a mission starts, so a mission already out keeps running whatever
; you do here. A REPEATING mission checks again every time it restarts: set this
; back to 0, or remove the plugin, and a repeating mission that needed the skill
; stops at its next restart with an error message rather than carrying on.
NoSkillRequirement=0

; 1 = let every mission start with a single worker, whatever it asks for. Most
; missions ask for one already - 693 of the game's 936 - so this changes the
; other 243: the ones that want 2, 3, 5, 8, 10 or some other number before they
; will start at all.
;
; Checked when a mission starts, with the same repeating-mission caveat as
; NoSkillRequirement above.
;
; This is the key the save warning at the top of the section is about: telling
; the game a mission needs only one worker is what makes a full crew look like a
; surplus crew when the mission finishes.
AnyOperatorCount=0

; ---------------------------------------------------------------------------
; Rewards
; ---------------------------------------------------------------------------

; Multiply how much of each item a mission pays, 1..100. 1 = vanilla. Both ends
; of every reward range are scaled, so a mission that paid 2-3 of something pays
; 6-9 at x3.
;
; Only the reward rows dispatch missions actually name are touched - 219 of
; them - never the game's wider drop table, so this does not turn into a loot
; multiplier for chests and carcasses.
;
; This reaches rewards that are already waiting to be paid, not only missions
; you have not sent yet: the game reads the amounts out of the table at the
; moment the items land. Which is also why it banks nothing - turn it back to 1,
; or remove the plugin, and anything still waiting pays vanilla.
Rewards=1

; ---------------------------------------------------------------------------
; The log
; ---------------------------------------------------------------------------

; 1 = one line per mission: its node, key, group, duration, minimum and maximum
; operator counts, combat power, step count, the skill it requires and the skill
; it pays a bonus for, and its condition keys. The summary, the histograms and
; the verdict at the end are printed either way - they are the useful part and
; they are only a few lines.
;
; The duration is printed twice, as `dur=160(16.0h)`: the game stores it in
; tenths of an hour, and the raw number is what compares against other mods'
; figures while the hours are what a person reads.
LogRecords=1

; Ceiling on the lines one pass writes - mission lines, reward lines, raw hex
; lines and the per-change lines Debug and DryRun add - so an unexpectedly large
; table cannot fill the log. From 0 to 20000. The summaries are never capped,
; and hitting this limit never stops a change being made.
MaxLines=4000

; 1 = show, do not touch. Every change the settings above ask for is logged and
; nothing at all is written to the game. Turn it on to see what the plugin would
; do after a game update, or when you are reporting a problem; then include the
; log.
DryRun=0

; 1 = also log the faction nodes that carry no missions at all, every change one
; line at a time, and the reason behind every record or entry the pass stepped
; over.
Debug=0

; 1 = log every mission's raw 0x120 bytes as hex, for locating a field whose
; offset is not known yet. One long line per mission, so leave it off unless you
; are hunting an offset.
DumpRaw=0

; 1 = also dump the reward rows the missions name: the items and amounts a
; mission pays, out of the game's dropsetinfo table. This is a diagnostic only -
; the Rewards multiplier above reads and edits those rows whether or not this is
; on. With DumpRaw=1 the raw bytes of each reward row and each of its entries
; are logged as well.
DumpRewards=1
