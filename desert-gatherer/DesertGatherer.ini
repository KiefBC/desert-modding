; Desert Gatherer - place next to DesertGatherer.asi in bin64. Read at game
; start and re-read while the game runs: the file's modified time is checked
; once a second. A changed multiplier only applies to records the game reads
; from then on, and the game reads its whole gather table once, at launch -
; so a change made while playing takes effect on the NEXT game start, not on
; the next gather. Reloading a save does not help. The README explains why.
[DesertGatherer]

; Master switch. 0 = the record-loader hook is installed but a pass-through:
; it reads and writes nothing. Like the multipliers, a change made while the
; game runs counts from the next launch.
Enabled=1

; 1 = show, do not touch. The hook logs a "[dry]" line for every record it
; would change - key, name, family, multiplier and each block's old and new
; min/max - and writes nothing to the game. Off by default.
;
; Turn it on to see what the plugin would do after a game update, or when you
; are reporting a problem; then include the log.
DryRun=0

; 1 = also log the records that are NOT gather nodes. The table holds about
; 13,875 records, so this is capped at 400 lines. Only useful when a family
; seems to be missing and you want to see what the loader is handing us.
Debug=0

; ---------------------------------------------------------------------------
; Yield multipliers, 1..100. 1 = vanilla, the record is left alone entirely.
; They multiply the minimum AND the maximum quantity a node produces, so a
; node that gave 1-3 gives 2-6 at x2.
;
; All four ship at 1, so the plugin changes nothing until you say otherwise.
; Raise the families you want, here or from Desert Overlay's in-game menu; x2
; is a good first try.
;
; Note that most nodes carry SEVERAL ranges and a single pick pays out one of
; them at random, so a multi-item plant varies from pick to pick in vanilla
; too - what is multiplied is every range, not the amount any one pick gave.
; A record of 4-7/2-3/1-1/1-1 becomes 8-14/4-6/2-2/2-2 at x2, so picks that
; used to give 1 now give 2 and picks that used to give 5 now give 10.
;
; The four families are independent internal groups in the game's own data,
; exactly as in the DMM pack. Setting one does not affect the others.
; ---------------------------------------------------------------------------

; Plants, fruit, berries, mushrooms, crops. 82 records.
Foraging=1

; Firewood cut from felled trees ("firewood_*"). 141 records.
Logging=1

; The "collect_mine" family: mine_* rocks and veins, cave and attached
; variants, breakable stalactites. 36 records.
Mining=1

; The "collect_ore" family: ore_* deposits, sulfur stone, collectible
; stalactites. 16 records. Separate from Mining - these look alike in game but
; are different families, so set both if you want all mining-style gathering
; raised together.
Ore=1

; ---------------------------------------------------------------------------
; CONFLICTS - read this
;
; This plugin edits the same minimum/maximum quantities that:
;   - DMM's "The Desert Gatherer" module pack (Foraging/Logging/Mining/Ore
;     Nodes at 2X/5X/10X), and
;   - DMM's built-in gathering multiplier preset
; edit on disk. If either is mounted while this .asi is installed, the two
; multiply on top of each other (DMM 5X plus Mining=2 here gives 10x).
;
; Unmount both in DMM before using this plugin.
; ---------------------------------------------------------------------------
