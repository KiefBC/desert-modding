[package]
name = "desert-gatherer"
version = "0.1.0"
description = "Desert Gatherer - Crimson Desert gathering yield multiplier (ASI plugin, stub)"
edition.workspace = true
license.workspace = true

[lib]
name = "desert_gatherer"
# Same split as desert-looter: cdylib for the .asi, rlib so `cargo test` links
# the platform-independent parts natively on Linux.
crate-type = ["cdylib", "rlib"]

[dependencies]
desert-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
