[package]
name = "desert-looter"
version = "0.5.0"
edition = "2021"
description = "Desert Looter - Crimson Desert gathering auto-loot (ASI plugin)"
license = "MIT"

[lib]
name = "desert_looter"
# cdylib -> the Windows .dll (renamed .asi). rlib -> lets `cargo test` link the
# platform-independent modules natively on Linux.
crate-type = ["cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",                  # SECURITY_ATTRIBUTES gates CreateThread
    "Win32_System_Diagnostics_Debug",  # MessageBeep lives here in windows-sys
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"      # never unwind across the FFI boundary into the game
lto = true
codegen-units = 1
strip = true
opt-level = 2
