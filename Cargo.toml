# Crimson Desert mods - one workspace, one shared core, one crate per mod.
#
#   desert-core     rlib, ships nothing: hooks, guarded reads, logger, PE/RTTI,
#                   byte patterns, ini parsing, the gather-record table.
#   desert-looter   cdylib -> DesertLooter.asi
#   desert-gatherer cdylib -> DesertGatherer.asi
#
# desert-gatherer-dmm/ is the DMM data mod (JSON offset patches), not a crate.

[workspace]
resolver = "2"
members = ["desert-core", "desert-looter", "desert-gatherer"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
desert-core = { path = "desert-core" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemServices",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",                  # SECURITY_ATTRIBUTES gates CreateThread
    "Win32_System_Diagnostics_Debug",  # MessageBeep lives here in windows-sys
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# The never-panic rule, enforced by the compiler instead of by review. Every
# crate opts in with `[lints] workspace = true`. A panic in the game process is
# a crash to desktop, so nothing that can panic at runtime is allowed in shipped
# code: no unwrap/expect, no indexing or slicing the compiler cannot see is in
# range, no panic!/unreachable!/todo!. Tests are exempt (clippy.toml), build
# scripts opt out at the top of the file. Every `unsafe` block carries a
# `// SAFETY:` comment, and unsafe operations inside `unsafe fn` bodies need
# their own block. `just clippy` runs with `-D warnings` on both targets.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

# Shared by every crate in the workspace: profile settings are only read from
# the workspace root.
[profile.release]
panic = "abort"      # never unwind across the FFI boundary into the game
lto = true
codegen-units = 1
strip = true
opt-level = 2
