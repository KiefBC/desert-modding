[package]
name = "desert-looter"
version = "0.3.0"
description = "Desert Looter - Crimson Desert gathering auto-loot (ASI plugin)"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "desert_looter"
# rlib only. This crate stopped being a plugin of its own: `desert-tooling` is
# the single cdylib and links this in as the auto-loot subsystem.
crate-type = ["rlib"]

[dependencies]
desert-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
