[package]
name = "desert-looter"
version = "0.5.0"
description = "Desert Looter - Crimson Desert gathering auto-loot (ASI plugin)"
edition.workspace = true
license.workspace = true

[lib]
name = "desert_looter"
# cdylib -> the Windows .dll (renamed .asi). rlib -> lets `cargo test` link the
# platform-independent modules natively on Linux.
crate-type = ["cdylib", "rlib"]

[dependencies]
desert-core.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
