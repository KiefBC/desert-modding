; Desert Looter - place next to DesertLooter.asi in bin64. Read at game start.
[DesertLooter]

; Master switch. 0 = the plugin loads but does nothing.
Enabled=1

; 1 = verbose log (structure dumps, timings, every decision).
Debug=0

; 1 = log every item the game hands the player, as `[recv] item <key>
; x<count>`, whether or not the plugin caused the pickup. For measuring
; yields; capped per session.
LogReceived=0

; Survey radius in game metres.
ScanRange=40

; The gather key and auto mode pick the nearest plant/ore/stone/wood node
; within this many metres (max 50). 6 m is confirmed to work.
GatherRange=6

; 1 = automatic gathering is on from the start (KeyToggle flips it).
AutoGather=0

; The game attaches interaction data to one nearby node at a time; the rest
; show as "Unarmed" in the survey. 1 = target those too (this is what lets
; auto mode mine whole veins without swinging). 0 = only armed nodes.
GatherUnarmed=1

; 1 = also pick up basic items lying on the ground (ore chunks and other
; "item_basic_*" drops). Quest and special items are never targeted, and
; anything the game would count as stealing is skipped.
GatherItems=1

; 1 = dropped weapons and armour ("item_basic_equip_*") are picked up too.
; Off by default: they are outside gathering and each one costs a bag slot.
GatherGear=0

; Which inventory tab counts as the bag for the "is it full" check. Tab 1 is
; the main bag (the HUD's n/132). The survey lists every tab as id:used/max.
; -1 = the tab with the largest capacity (not the bag; do not use).
BagTab=1

; When the bag is full, a node whose yield is already stacked in the bag is
; still gathered (the game allows that), unless the stack would pass this
; ceiling. Stacks of 585 have been seen, so 999 is a margin, not a game rule.
StackLimit=999

; Milliseconds between two automatic sends (100..60000). Nodes and chunks
; vanish within about 100 ms of a send.
GatherInterval=500

; After sending for a node, leave it alone this long before trying it again
; (100..60000 ms). A node that disappears sooner is counted as gathered.
NodeCooldown=8000

; Keys: F1..F24, A..Z, 0..9, NUM0..NUM9, NUMPLUS NUMMINUS NUMMULT NUMDIV NUMDOT,
; HOME END INSERT DELETE PAGEUP PAGEDOWN TAB SPACE BACKSPACE SCROLLLOCK PAUSE,
; MOUSE3 MOUSE4 MOUSE5. Avoid keys the game uses.
KeyToggle=F10
KeyScan=F11
; Gather the nearest node: one node per press, whatever the auto state.
KeyGather=F9
; Debug: toggle recording of every event the game queues (capped at 300).
KeyRecord=F7
