; Desert Overlay - place next to DesertOverlay.asi in bin64. Read once at game
; start; changing it needs a restart. (The settings it puts on screen are read
; and written live - it is only this file, the overlay's own, that is not.)
[DesertOverlay]

; Master switch. 0 = the plugin loads, writes one log line and installs no
; graphics hook at all, so the game renders exactly as it does without the
; .asi. Use this rather than deleting the file if you want to rule the overlay
; out while chasing a crash.
Enabled=1

; 1 = verbose log. Every ini write and reload gets a line in
; DesertOverlay.log, and everything hudhook says is logged with it - not only
; its warnings and errors but its per-frame debug and trace lines, which is
; what a "the game will not start" or "the menu never appears" report needs.
; That is a lot of writing: the log stops growing after 20000 hudhook lines,
; and a restart is what starts it again. Off by default; warnings and errors
; are always logged.
Debug=0

; The key that shows and hides the menu. Pressed once to open, once to close.
;
; Names: F1..F24, A..Z, 0..9, NUM0..NUM9, NUMPLUS NUMMINUS NUMMULT NUMDIV
; NUMDOT, HOME END INSERT DELETE PAGEUP PAGEDOWN TAB SPACE BACKSPACE
; SCROLLLOCK PAUSE, MOUSE3 MOUSE4 MOUSE5.
;
; Avoid keys the game uses, and avoid the ones Desert Looter already has
; (F7, F9, F10, F11 by default).
KeyMenu=Insert

; 1 = the menu is already open at the first frame, instead of waiting for the
; key. Handy the first time, so you can see that the overlay is working at all.
ShowOnStart=0

; Size of the menu: fonts, spacing and the window itself. 0 = follow the
; Windows display scaling (125% in Settings > Display gives 1.25). Set a number
; from 0.5 to 4 to fix it; 2 is comfortable on a 4K screen at 100% scaling.
Scale=0

; Height of the menu's text in pixels, before Scale is applied: at Scale 1.25
; a FontSize of 20 is rasterised at 25 px. From 8 to 72. The font is rendered
; at that size rather than blown up from a small bitmap, so raising this makes
; the text sharper, not blockier. Raise it if the menu is hard to read.
FontSize=20

; The font the menu is drawn in. A bare file name is looked up in the Windows
; Fonts folder (%WINDIR%\Fonts); an absolute path is used as it stands. Leave
; it empty to go back to Dear ImGui's own small built-in font.
;
; segoeui.ttf is the Windows UI font and the clearest at small sizes. For a
; more fantasy, serif look try georgia.ttf, constan.ttf (Constantia) or
; cambria.ttc:0 - the :N suffix picks a face out of a .ttc collection, and 0
; is the first, which is what you want unless you know otherwise.
;
; A file that is missing or unreadable is not an error: the menu says so in
; DesertOverlay.log and draws with the built-in font.
Font=segoeui.ttf

; How bright the menu's white is on an HDR display, in nits. The game presents
; an HDR10 signal, and the menu has to be encoded for it or it comes out blown
; out and oversaturated; this is the level plain white is drawn at. 203 is the
; broadcast reference for paper white and what ReShade's own overlay uses.
; Raise it if the menu looks dull next to the game, lower it if it glares.
; From 80 to 1000. Ignored entirely on an SDR display.
HdrBrightness=203

; Which colour space the menu is encoded for.
;
;   auto   ask the swapchain and follow it (what the game says it presents)
;   sdr    plain sRGB, exactly what versions before this one always did
;   hdr10  force BT.2020 primaries with the PQ transfer curve
;   scrgb  force linear BT.709, 1.0 = 80 nits
;
; Leave it on auto. The three forced values are for when the detection is
; wrong - the symptom is a menu that is washed out, too dark or wildly
; oversaturated while the game itself looks right.
ColorSpace=auto

; The menu's colour theme. The picker at the top of the menu switches it live
; and prints the name to pick here; this key is what makes the choice stick.
; Unknown names fall back to classic with a warning in DesertOverlay.log.
; One of: classic, parchment, gilded, splash, banner, steel
Theme=banner

; ---------------------------------------------------------------------------
; WHAT THE MENU EDITS
;
; The overlay does not talk to the other two plugins. It reads and writes
; DesertLooter.ini and DesertGatherer.ini in this same folder, and those
; plugins notice the change within about a second and apply it. So:
;
;   - editing a file by hand while the game runs also works, and the menu
;     picks the change up within a second;
;   - the menu only ever rewrites the values of the keys it shows. Your
;     comments, your key order and any key it does not know about (BagTab,
;     LogReceived, the KeyToggle/KeyScan/KeyGather bindings) are left exactly
;     as they are;
;   - a setting changed from the menu is permanent. It is in the file, so it
;     is still there next time you launch.
;
; If a file cannot be read or written the menu says so in red and nothing is
; lost; the game is never affected.
; ---------------------------------------------------------------------------
