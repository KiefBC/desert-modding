[package]
name = "desert-overlay"
version = "0.2.0"
description = "Desert Overlay - the in-game settings menu subsystem of Desert Tooling"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "desert_overlay"
# A library, not a plugin: `desert-tooling` is the only cdylib in the
# workspace and the only DllMain. This crate is linked into it and exposes
# `start(hmodule, sections)`.
crate-type = ["rlib"]

[dependencies]
desert-core.workspace = true

# hudhook and imgui are declared here rather than in [workspace.dependencies]
# because exactly one crate uses them, the way desert-core keeps proptest local.
#
# hudhook 0.9.2 (MIT) hooks the game's DXGI present/resize and runs a Dear ImGui
# render loop inside it. default-features = false drops dx9/dx11/opengl3 (the
# last of which drags in gl_generator) and `inject` (a DLL injector we do not
# need: the ASI loader does the loading). Crimson Desert is DX12.
#
# Neither crate builds for x86_64-unknown-linux-gnu - imgui-sys compiles the
# C++ Dear ImGui sources for the target - so both are Windows-only and every
# use of them in src/ is behind #[cfg(windows)].
[target.'cfg(windows)'.dependencies]
hudhook = { version = "0.9.2", default-features = false, features = ["dx12"] }
imgui = "0.12"
windows-sys.workspace = true
