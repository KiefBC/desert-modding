[package]
name = "desert-core"
version = "0.1.0"
description = "Shared plumbing for the Crimson Desert ASI plugins: hooks, guarded reads, logging, PE/RTTI, patterns"
edition.workspace = true
license.workspace = true

[lib]
name = "desert_core"
# A plain rlib: this crate ships nothing on its own, it is linked into each
# plugin's cdylib.
crate-type = ["rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
